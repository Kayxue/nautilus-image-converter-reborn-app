name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Build Linux packages (.deb + .rpm) for x86_64 and arm64
  # Strategy:
  #   • Use ghcr.io/gtk-rs/gtk4-rs/gtk4:latest container on both arches.
  #     This image ships a modern GTK4 (>= 4.21) which Ubuntu apt does NOT
  #     provide, and is the approach recommended by the Relm4 book.
  #   • x86_64  → ubuntu-latest runner
  #   • arm64   → ubuntu-24.04-arm runner (GitHub-hosted native ARM)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux-packages:
    name: 📦 Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # gtk4-rs/gtk4 ships GTK4 >= 4.21 — Ubuntu apt only has 4.14.
    # Using this container is the approach recommended by the Relm4 book.
    container:
      image: ghcr.io/gtk-rs/gtk4-rs/gtk4:latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            deb-arch: amd64

          - arch: arm64
            runner: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            deb-arch: arm64

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      # ── Extra tools for packaging (GTK4 is already in the container) ──────
      # The container is Fedora-based; install dpkg (for cargo-deb) and
      # openssl headers. patchelf is used by cargo-deb to adjust RPATH.
      - name: ⚙️ Install packaging tools
        run: |
          dnf install -y \
            patchelf \
            dpkg \
            openssl-devel \
            findutils

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: 🦀 Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: 🗄️ Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # ── Build release binary ──────────────────────────────────────────────
      - name: 🛠️ Build release binary
        run: cargo build --release --locked --target ${{ matrix.rust-target }}

      # Cargo packaging tools expect the binary at target/release/, not
      # target/<triple>/release/. Create a symlink so both cargo-deb and
      # cargo-generate-rpm find it without extra flags.
      - name: 🔗 Expose binary at target/release/
        run: |
          mkdir -p target/release
          cp target/${{ matrix.rust-target }}/release/nautilus_image_converter \
             target/release/nautilus_image_converter

      # ── Install packaging tools ───────────────────────────────────────────
      - name: ⬇️ Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      # ── .deb ─────────────────────────────────────────────────────────────
      - name: 📬 Create .deb package
        run: |
          cargo deb --no-build --target ${{ matrix.rust-target }}
          # Move to a predictable location for the upload step
          mkdir -p dist
          cp target/${{ matrix.rust-target }}/debian/*.deb \
             dist/nautilus-image-converter-reborn_${{ matrix.arch }}.deb

      # ── .rpm ─────────────────────────────────────────────────────────────
      - name: 📬 Create .rpm package
        run: |
          cargo generate-rpm --target ${{ matrix.rust-target }}
          mkdir -p dist
          cp target/${{ matrix.rust-target }}/generate-rpm/*.rpm \
             dist/nautilus-image-converter-reborn_${{ matrix.arch }}.rpm

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: ⬆️ Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

      - name: ⬆️ Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm

  # ─────────────────────────────────────────────────────────────────────────────
  # Create a GitHub Release and attach all packages (tag pushes only)
  # ─────────────────────────────────────────────────────────────────────────────
  create-release:
    name: 🚀 Create GitHub Release
    needs: [build-linux-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⬇️ Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: 📝 Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=Release $TAG" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<EOF'
            echo "## What's changed in $TAG"
            git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^)"..HEAD || \
            git log --pretty=format:'- %s' -n 10
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
