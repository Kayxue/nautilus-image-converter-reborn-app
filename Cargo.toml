[package]
name = "nautilus_image_converter"
version = "0.1.0"
edition = "2024"
description = "Standalone app to convert, resize, and rotate images — built with Rust and GTK4"

[dependencies]
anyhow = "1.0.103"
argh = "0.1.19"
fast_image_resize = { version = "6.0.0", features = ["image", "rayon"] }
image = "0.25.10"
thiserror = "2.0.18"
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
gdk4-x11 = { version = "0.11", features = ["xlib"] }
relm4 = { version = "0.11", features = ["libadwaita"] }
imageproc = "0.27.0"
strum_macros = "0.28.0"
gdk4-wayland = "0.11"
rayon = "1.12.0"

# ─── Debian packaging (cargo-deb) ────────────────────────────────────────────
[package.metadata.deb]
name = "nautilus-image-converter-reborn"
maintainer = "Kay <s0990006@gmail.com>"
copyright = "2026 Kay"
license-file = ["LICENSE", "0"]
extended-description = """\
Standalone app to convert, resize, and rotate images. \
Built with Rust and GTK4 via Relm4."""
depends = "$auto, libgtk-4-1, libadwaita-1-0, libwayland-client0"
assets = [
    ["target/release/nautilus_image_converter", "usr/bin/nautilus-image-converter", "755"],
    ["README.md", "usr/share/doc/nautilus-image-converter-reborn/README.md", "644"],
    ["LICENSE", "usr/share/doc/nautilus-image-converter-reborn/LICENSE", "644"],
]

# ─── RPM packaging (cargo-generate-rpm) ──────────────────────────────────────
[package.metadata.generate-rpm]
name = "nautilus-image-converter-reborn"
license = "MIT"
assets = [
    { source = "target/release/nautilus_image_converter", dest = "/usr/bin/nautilus-image-converter", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/nautilus-image-converter-reborn/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/nautilus-image-converter-reborn/LICENSE", mode = "644" },
]
[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
